<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquarium met Houten Lijst</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* Het frame vult nu exact 100% van het Utherverse sign display */
.frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 28px solid #4a2c11; /* Dikte van de houten rand */
    box-shadow: 
        inset 0 0 15px rgba(0, 0, 0, 0.9),
        0 0 10px rgba(0, 0, 0, 0.5);
    
    /* Houtstructuur effect */
    background: 
        linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%),
        repeating-linear-gradient(
            45deg,
            #3b220c,
            #3b220c 10px,
            #4a2c11 10px,
            #4a2c11 20px,
            #2e1906 20px,
            #2e1906 30px
        );
    overflow: hidden;
}

/* Binnenste afwerklijst */
.frame::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 3px solid rgba(0, 0, 0, 0.6);
    z-index: 2;
    pointer-events: none;
}

/* YouTube Video Player */
#player {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%) scale(1.05); /* Schaalt iets op om zwarte balkjes van YouTube te verbergen */
    border: none;
    pointer-events: none;
    z-index: 1;
}
</style>
</head>

<body>

<div class="frame">
    <iframe
        id="player"
        src="https://www.youtube.com/embed/KxNm8313grs?autoplay=1&mute=1&controls=0&loop=1&playlist=KxNm8313grs&rel=0&modestbranding=1&fs=1"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
